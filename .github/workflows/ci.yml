name: SZR Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data (fast mode — 100 scenarios)
        env:
          N_SCENARIOS: "100"
        run: python data/generate_data.py

      - name: Model smoke test
        # outputs/best_model.pt is gitignored (generated by train.py locally).
        # The smoke test validates the model architecture and import chain by
        # instantiating a fresh SZRPredictor with random weights and asserting
        # the forward-pass output shape matches the expected (1, 3).
        run: |
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "model")
          import torch
          from szr_predictor import SZRPredictor

          model = SZRPredictor(input_dim=8, hidden_dims=[64, 128], output_dim=3)
          model.eval()
          with torch.no_grad():
              out = model(torch.zeros(1, 8))
          assert out.shape == (1, 3), f"Expected output shape (1, 3), got {out.shape}"
          print("Model inference OK")
          PYEOF
